<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SPACE GLIDER</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    cursor: crosshair; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #screen { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #000; }
  .crt { position: fixed; inset: 0; pointer-events: none; }
  /* faint raster + tube vignette; toggle with C */
  .crt.scan {
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.20) 3px, rgba(0,0,0,0) 4px);
  }
  .crt.vig { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.6) 100%); }
  body.nocrt .crt { display: none; }
  noscript { color: #3dffc5; font: 16px monospace; position: fixed; inset: 0; display: grid; place-items: center; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div class="crt scan"></div>
<div class="crt vig"></div>
<noscript>SPACE GLIDER needs JavaScript.</noscript>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/models.js"></script>
<script src="js/game.js"></script>
</body>
</html>
